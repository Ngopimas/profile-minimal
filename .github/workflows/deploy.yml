name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Daily check so posts dated in the future appear on their date.
  # Posts are dated 08:00 UTC; this runs shortly after. The check job below
  # skips the build when there is nothing new to publish.
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer master build supersedes any queued or running Pages deployment.
# This prevents an orphaned deployment from blocking the queue indefinitely.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A push or a manual run always builds. A scheduled run builds only when a
  # post became visible since the last successful run, or when master has a
  # commit that run did not deploy.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GitHub disables schedules after 60 days without repository activity.
      # Re-enabling the workflow through the API resets that timer.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/enable"

      - name: Decide whether to build
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow deploy.yml --status success --limit 1 \
            --json headSha,createdAt --jq '.[0] | "\(.headSha) \(.createdAt)"')
          last_sha=${last%% *}
          last_time=${last##* }
          if [ -z "$last" ] || [ "$last_sha" != "$GITHUB_SHA" ]; then
            echo "master has commits the last successful run did not deploy."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          due=$(node .github/scripts/due-posts.mjs "$last_time")
          if [ -n "$due" ]; then
            echo "Posts due since $last_time:"
            echo "$due"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to publish since $last_time."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
